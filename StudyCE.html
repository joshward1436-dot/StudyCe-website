<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyCE Civil Engineering Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1f3a;
      --steel: #1e3a5f;
      --accent: #e8a838;
      --accent-dark: #c98a1e;
      --light: #f5f7fa;
      --muted: #6b7c93;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--light);
      color: var(--navy);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--navy);
      color: var(--white);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--white);
    }

    .logo-icon {
      width: 42px;
      height: 42px;
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--accent);
    }

    nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      margin-left: 1.75rem;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--steel) 100%);
      color: var(--white);
      padding: 5rem 2rem 6rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.6;
    }

    .hero-content {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
    }

    .hero-illustration {
      width: 180px;
      height: 180px;
      margin: 0 auto 2rem;
      display: block;
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      line-height: 1.15;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      font-size: 1.15rem;
      color: rgba(255,255,255,0.85);
      max-width: 540px;
      margin: 0 auto 2.25rem;
    }

    .cta {
      display: inline-block;
      background: var(--accent);
      color: var(--navy);
      font-weight: 600;
      padding: 0.9rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(232,168,56,0.35);
    }

    .cta:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    /* Features */
    .features {
      max-width: 1100px;
      margin: -3rem auto 4rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      position: relative;
      z-index: 2;
    }

    .card {
      background: var(--white);
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 8px 24px rgba(11,31,58,0.08);
      border: 1px solid rgba(11,31,58,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(11,31,58,0.12);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background: rgba(232,168,56,0.12);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .card-icon svg {
      width: 26px;
      height: 26px;
      fill: var(--accent-dark);
    }

    .card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      color: var(--navy);
    }

    .card p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* Footer */
    footer {
      margin-top: auto;
      background: var(--navy);
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: 0.9rem;
    }

    footer strong {
      color: var(--accent);
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      nav a {
        margin-left: 1rem;
        margin-right: 1rem;
      }
      .hero {
        padding: 3.5rem 1.25rem 5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo">
      <!-- Simple bridge / structure icon -->
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="32" width="8" height="12" rx="1" fill="#e8a838"/>
        <rect x="36" y="32" width="8" height="12" rx="1" fill="#e8a838"/>
        <path d="M8 32 L24 14 L40 32" stroke="#e8a838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M12 32 L24 20 L36 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="20" y="28" width="8" height="4" rx="0.5" fill="#ffffff"/>
      </svg>
      <span class="logo-text">Study<span>CE</span></span>
    </a>
    <nav>
      <a href="#resources">Resources</a>
      <a href="#about">About</a>
      <a href="contact">Contact</a>
      <a href="Signup.html">Sign in</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <!-- Civil engineering illustration: bridge + blueprint feel -->
      <svg class="hero-illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Soft circle background -->
        <circle cx="100" cy="100" r="90" fill="rgba(255,255,255,0.06)"/>
        <!-- Bridge deck -->
        <rect x="20" y="110" width="160" height="10" rx="2" fill="#e8a838"/>
        <!-- Left pier -->
        <rect x="30" y="120" width="18" height="45" rx="2" fill="#ffffff" opacity="0.9"/>
        <!-- Right pier -->
        <rect x="152" y="120" width="18" height="45" rx="2" fill="#ffffff" opacity="0.9"/>
        <!-- Center pier -->
        <rect x="91" y="120" width="18" height="45" rx="2" fill="#ffffff" opacity="0.9"/>
        <!-- Arch left -->
        <path d="M39 110 Q70 55 100 110" stroke="#e8a838" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Arch right -->
        <path d="M100 110 Q130 55 161 110" stroke="#e8a838" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Cable lines (suspension feel) -->
        <line x1="50" y1="110" x2="50" y2="85" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
        <line x1="70" y1="110" x2="70" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
        <line x1="130" y1="110" x2="130" y2="70" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
        <line x1="150" y1="110" x2="150" y2="85" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
        <!-- Top tower left -->
        <rect x="46" y="55" width="8" height="55" rx="1" fill="#ffffff" opacity="0.85"/>
        <!-- Top tower right -->
        <rect x="146" y="55" width="8" height="55" rx="1" fill="#ffffff" opacity="0.85"/>
        <!-- Small buildings / skyline hint -->
        <rect x="10" y="145" width="12" height="25" rx="1" fill="rgba(255,255,255,0.25)"/>
        <rect x="178" y="140" width="14" height="30" rx="1" fill="rgba(255,255,255,0.25)"/>
        <!-- Hard hat hint (simple) -->
        <ellipse cx="100" cy="38" rx="18" ry="8" fill="#e8a838"/>
        <path d="M82 38 Q100 18 118 38" fill="#e8a838"/>
      </svg>

      <h1><span>Civil Engineering</span></h1>
      <p>
        StudyCE learn Civil Engineering subjects, simply and clearly.
      </p>
      <a href="#courses" class="cta">School Year</a>
    </div>
  </section>

  <section class="features" id="courses">
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h3>1st Year</h3>
      <p></p>
    </div>
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d=""/></svg>
      </div>
      <h3>2nd Year</h3>
      <p></p>
    </div>
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d=""/></svg>
      </div>
      <h3>3rd Year</h3>
      <p></p>
      </div>
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d=""/></svg>
      </div>
      <h3>4th Year</h3>
      <p></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 <strong>StudyCE</strong> Built for future civil engineers</p>
    <p>&copy; <strong>StudyCE</strong> Goodluck</p>
  </footer>
</body>
</html>
